<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RailInspector Dashboard</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap');

  :root {
    --navy: #00539C;
    --navy-dark: #0B2545;
    --orange: #F26522;
    --orange-dark: #C24E15;

    --bg: #F3EFE7;
    --surface: #FFFFFF;
    --surface-2: #FBF7F1;
    --border: #E4DED2;
    --text: #16233F;
    --text-dim: #6E6A60;

    --success: #178A4C;
    --success-bg: #E4F4EA;
    --danger: #C0392B;
    --danger-bg: #FBEAE7;
    --radius: 10px;
  }

  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    font-family: 'Montserrat', sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------- Header ---------- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 10px 20px;
    background: var(--surface-2);
    border-bottom: 1px solid var(--border);
    border-top: 3px solid var(--orange);
    flex-shrink: 0;
    z-index: 20;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }
  .brand-logos {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .brand-logos img {
    height: 34px;
    width: 34px;
    object-fit: contain;
    border-radius: 50%;
    background: #fff;
    border: 1px solid var(--border);
    padding: 2px;
  }
  .brand-divider {
    width: 1px;
    height: 28px;
    background: var(--border);
    flex-shrink: 0;
  }
  .brand-text h1 {
    font-size: 16px;
    font-weight: 700;
    margin: 0;
    letter-spacing: 0.2px;
    color: var(--navy-dark);
  }
  .brand-text .subtitle {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .header-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  #status {
    font-size: 11px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 20px;
    background: var(--danger-bg);
    color: var(--danger);
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  #status i { font-size: 8px; }
  #status.online { background: var(--success-bg); color: var(--success); }
  #status.offline { background: var(--danger-bg); color: var(--danger); }

  .icon-btn {
    display: none;
    width: 34px;
    height: 34px;
    align-items: center;
    justify-content: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--navy-dark);
    cursor: pointer;
    font-size: 15px;
    flex-shrink: 0;
  }

  .trip-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--navy-dark);
    font-family: 'Montserrat', sans-serif;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .trip-btn:hover { background: var(--surface-2); }
  .trip-btn i { color: var(--navy); font-size: 12px; }
  .trip-btn .label-full { display: inline; }
  @media (max-width: 560px) {
    .trip-btn .label-full { display: none; }
  }

  /* ---------- Layout ---------- */
  .layout {
    flex: 1;
    display: flex;
    min-height: 0;
    position: relative;
  }
  #map {
    flex: 1;
    height: 100%;
  }

  aside {
    width: 320px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .stats-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 14px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .stat-card {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px;
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }
  .stat-card i {
    font-size: 14px;
    margin-top: 3px;
    color: var(--navy);
  }
  .stat-card .value {
    font-size: 19px;
    font-weight: 700;
    line-height: 1.2;
    color: var(--navy-dark);
  }
  .stat-card .label {
    font-size: 10.5px;
    color: var(--text-dim);
    margin-top: 2px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }

  .panel-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px 8px;
    flex-shrink: 0;
  }
  .panel-heading h2 {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-dim);
    margin: 0;
  }
  .panel-heading .count-badge {
    font-size: 11px;
    background: #FDEBE0;
    color: var(--orange-dark);
    padding: 2px 8px;
    border-radius: 20px;
    font-weight: 700;
  }

  #damage-list {
    flex: 1;
    overflow-y: auto;
    padding: 0 10px 10px;
  }
  #damage-list::-webkit-scrollbar { width: 6px; }
  #damage-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .damage-item {
    display: flex;
    gap: 10px;
    padding: 8px;
    border-radius: var(--radius);
    cursor: pointer;
    border: 1px solid transparent;
    margin-bottom: 6px;
    transition: background 0.12s ease, border-color 0.12s ease;
  }
  .damage-item:hover {
    background: var(--surface-2);
    border-color: var(--border);
  }
  .damage-item img {
    width: 52px;
    height: 52px;
    object-fit: cover;
    border-radius: 6px;
    flex-shrink: 0;
    background: var(--surface-2);
  }
  .damage-item .info {
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .damage-item .keterangan {
    font-size: 12.5px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text);
  }
  .damage-item .waktu {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 2px;
  }
  .damage-item .waktu i { margin-right: 4px; }

  .empty-state {
    text-align: center;
    padding: 32px 16px;
    color: var(--text-dim);
    font-size: 12.5px;
  }
  .empty-state i {
    font-size: 24px;
    display: block;
    margin-bottom: 8px;
    color: var(--border);
  }

  /* ---------- Leaflet theming ---------- */
  .leaflet-popup-content-wrapper {
    background: var(--surface);
    color: var(--text);
    border-radius: var(--radius);
  }
  .leaflet-popup-tip { background: var(--surface); }
  .leaflet-popup-content { margin: 10px; }
  .damage-popup img {
    width: 220px;
    max-width: 100%;
    border-radius: 6px;
    display: block;
    margin-bottom: 6px;
  }
  .damage-popup .keterangan {
    font-size: 13px;
    font-weight: 600;
    margin: 4px 0 2px;
  }
  .damage-popup .waktu {
    font-size: 11px;
    color: var(--text-dim);
  }
  .damage-popup .waktu i { margin-right: 4px; }
  .lori-popup { min-width: 170px; }
  .lori-popup .title {
    font-size: 13px;
    font-weight: 700;
    color: var(--navy-dark);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .lori-popup .row {
    font-size: 12px;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 3px 0;
  }
  .lori-popup .row + .row { border-top: 1px solid var(--border); }
  .lori-popup i { color: var(--navy); width: 14px; text-align: center; flex-shrink: 0; }

  /* ---------- Modal: Log Perjalanan ---------- */
  .modal-scrim {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(11,37,69,0.5);
    z-index: 2000;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-scrim.open { display: flex; }
  .modal {
    background: var(--surface);
    border-radius: 12px;
    width: 100%;
    max-width: 480px;
    max-height: 85vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(11,37,69,0.3);
  }
  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .modal-header h2 {
    font-size: 14px;
    font-weight: 700;
    color: var(--navy-dark);
    margin: 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .modal-header h2 i { color: var(--orange); }
  .modal-close {
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 12px;
  }
  .modal-body {
    padding: 14px 16px;
    overflow-y: auto;
  }
  .reset-trip-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px;
    background: var(--orange);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-family: 'Montserrat', sans-serif;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 14px;
  }
  .reset-trip-btn:hover { background: var(--orange-dark); }
  .reset-trip-btn:disabled { opacity: 0.6; cursor: default; }

  .trip-row {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .trip-row-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
  }
  .trip-row-time {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text);
  }
  .trip-badge {
    font-size: 10px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 20px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .trip-badge.aktif { background: var(--success-bg); color: var(--success); }
  .trip-badge.selesai { background: var(--surface-2); color: var(--text-dim); }
  .trip-row-stats {
    display: flex;
    gap: 14px;
    font-size: 11.5px;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  .trip-row-stats i { color: var(--navy); margin-right: 4px; }
  .trip-view-btn {
    font-size: 11.5px;
    font-weight: 600;
    color: var(--navy);
    background: none;
    border: 1px solid var(--navy);
    border-radius: 20px;
    padding: 5px 12px;
    cursor: pointer;
  }
  .trip-view-btn:hover { background: var(--surface-2); }

  /* ---------- Banner: sedang lihat jalur trip lama ---------- */
  .history-banner {
    display: none;
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1001;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 8px 8px 8px 14px;
    box-shadow: 0 4px 14px rgba(11,37,69,0.18);
    align-items: center;
    gap: 10px;
    font-size: 12px;
    max-width: 90vw;
  }
  .history-banner.open { display: flex; }
  .history-banner span { color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .history-banner button {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--navy);
    color: #fff;
    border: none;
    border-radius: 16px;
    padding: 6px 12px;
    font-family: 'Montserrat', sans-serif;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 820px) {
    .brand-text .subtitle { display: none; }
    .icon-btn { display: flex; }
    aside {
      position: fixed;
      top: 57px;
      bottom: 0;
      left: 0;
      width: 85vw;
      max-width: 340px;
      transform: translateX(-100%);
      transition: transform 0.2s ease;
      z-index: 1000;
      box-shadow: 4px 0 24px rgba(0,0,0,0.25);
    }
    aside.open { transform: translateX(0); }
    .scrim {
      display: none;
      position: fixed;
      inset: 57px 0 0 0;
      background: rgba(11,37,69,0.45);
      z-index: 999;
    }
    .scrim.open { display: block; }
  }

  @media (max-width: 420px) {
    .brand-logos img { height: 28px; width: 28px; }
    .brand-text h1 { font-size: 14px; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <button class="icon-btn" id="menu-toggle" aria-label="Buka daftar kerusakan"><i class="fa-solid fa-bars"></i></button>
    <div class="brand-logos">
      <img src="/static/img/logo-polinema.png" alt="Logo Politeknik Negeri Malang">
      <img src="/static/img/logo-kai.png" alt="Logo KAI">
    </div>
    <div class="brand-divider"></div>
    <div class="brand-text">
      <h1>RailInspector</h1>
      <div class="subtitle">Monitoring Kerusakan Rel Kereta Api &mdash; Politeknik Negeri Malang</div>
    </div>
  </div>
  <div class="header-actions">
    <button class="trip-btn" id="trip-log-btn"><i class="fa-solid fa-clock-rotate-left"></i><span class="label-full">Log Perjalanan</span></button>
    <div id="status" class="offline"><i class="fa-solid fa-circle"></i><span class="label">Menghubungkan...</span></div>
  </div>
</header>

<div class="layout">
  <div class="history-banner" id="history-banner">
    <span id="history-banner-text"></span>
    <button id="history-banner-close"><i class="fa-solid fa-xmark"></i>Kembali ke live</button>
  </div>
  <aside id="sidebar">
    <div class="stats-row">
      <div class="stat-card">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <div>
          <div class="value" id="stat-total">0</div>
          <div class="label">Total Kerusakan</div>
        </div>
      </div>
      <div class="stat-card">
        <i class="fa-solid fa-train"></i>
        <div>
          <div class="value" id="stat-lori">&mdash;</div>
          <div class="label">Status Lori</div>
        </div>
      </div>
    </div>
    <div class="panel-heading">
      <h2>Daftar Kerusakan</h2>
      <span class="count-badge" id="list-count">0</span>
    </div>
    <div id="damage-list">
      <div class="empty-state">
        <i class="fa-solid fa-camera-retro"></i>
        Belum ada kerusakan yang tercatat.
      </div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div id="map"></div>
</div>

<div class="modal-scrim" id="trip-modal-scrim">
  <div class="modal">
    <div class="modal-header">
      <h2><i class="fa-solid fa-route"></i>Log Perjalanan Lori</h2>
      <button class="modal-close" id="trip-modal-close" aria-label="Tutup"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="modal-body">
      <button class="reset-trip-btn" id="reset-trip-btn">
        <i class="fa-solid fa-rotate-left"></i>Reset Perjalanan (Mulai Siklus Baru)
      </button>
      <div id="trip-list">
        <div class="empty-state"><i class="fa-solid fa-route"></i>Memuat riwayat perjalanan...</div>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const map = L.map('map', { zoomControl: false }).setView([-7.9553, 112.6146], 15); // default: Malang
  L.control.zoom({ position: 'bottomright' }).addTo(map);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  // Posisi lori saat ini: ikon kereta.
  const loriIcon = L.divIcon({
    className: 'lori-icon',
    html: '<div style="background:#00539C;width:30px;height:30px;border-radius:50%;border:3px solid white;box-shadow:0 2px 8px rgba(0,83,156,0.6);display:flex;align-items:center;justify-content:center;"><i class="fa-solid fa-train" style="color:#fff;font-size:13px;"></i></div>',
    iconSize: [36, 36],
    iconAnchor: [18, 18],
  });

  const damageIcon = L.divIcon({
    className: 'damage-icon',
    html: '<div style="background:#F26522;width:14px;height:14px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid white;box-shadow:0 1px 4px rgba(0,0,0,0.3);"></div>',
    iconSize: [18, 18],
    iconAnchor: [9, 18],
  });

  let loriMarker = null;
  const damageMarkers = {};
  const trailDots = new Set(); // kunci waktu yang sudah digambar sebagai titik posisi lama
  let hasFitBounds = false;
  let historyPolyline = null; // jalur trip lama yang sedang ditampilkan (mode "lihat jalur")

  // Popup posisi lori: koordinat + baterai/kecepatan asli dari perangkat GPS
  // (dikirim lewat POST /api/gps, field opsional — tampil "-" kalau belum ada datanya).
  function loriPopupHtml(point) {
    const battery = (point.battery === null || point.battery === undefined) ? '-' : `${Math.round(point.battery)}%`;
    const speed = (point.speed === null || point.speed === undefined) ? '-' : `${Math.round(point.speed)} km/jam`;
    return `
      <div class="lori-popup">
        <div class="title"><i class="fa-solid fa-train"></i>Posisi Lori Saat Ini</div>
        <div class="row"><i class="fa-solid fa-location-dot"></i>${point.lat.toFixed(5)}, ${point.lon.toFixed(5)}</div>
        <div class="row"><i class="fa-solid fa-battery-three-quarters"></i>Baterai: ${battery}</div>
        <div class="row"><i class="fa-solid fa-gauge-high"></i>Kecepatan: ${speed}</div>
      </div>
    `;
  }

  const sidebar = document.getElementById('sidebar');
  const scrim = document.getElementById('scrim');
  document.getElementById('menu-toggle').addEventListener('click', () => {
    sidebar.classList.toggle('open');
    scrim.classList.toggle('open');
  });
  scrim.addEventListener('click', () => {
    sidebar.classList.remove('open');
    scrim.classList.remove('open');
  });

  async function fetchJSON(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error('Gagal mengambil data: ' + url);
    return res.json();
  }

  async function postJSON(url) {
    const res = await fetch(url, { method: 'POST' });
    if (!res.ok) throw new Error('Gagal mengirim ke: ' + url);
    return res.json();
  }

  function formatWaktu(iso) {
    return new Date(iso).toLocaleString('id-ID', {
      day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit'
    });
  }

  async function updateLoriPosition() {
    try {
      const current = await fetchJSON('/api/gps/current');
      setStatus(true);
      const statLori = document.getElementById('stat-lori');
      if (!current) {
        statLori.textContent = 'Belum ada sinyal';
        return;
      }
      statLori.textContent = 'Aktif';
      const latlng = [current.lat, current.lon];
      const popupHtml = loriPopupHtml(current);
      if (!loriMarker) {
        loriMarker = L.marker(latlng, { icon: loriIcon }).addTo(map)
          .bindPopup(popupHtml);
        if (!hasFitBounds) map.setView(latlng, 16);
      } else {
        loriMarker.setLatLng(latlng);
        loriMarker.setPopupContent(popupHtml);
      }
    } catch (e) {
      setStatus(false);
      console.error(e);
    }
  }

  // Titik-titik posisi lori sebelumnya (bukan posisi terkini) digambar sebagai dot kecil.
  async function updateLoriTrail() {
    try {
      const history = await fetchJSON('/api/gps/history');
      if (!Array.isArray(history) || history.length === 0) return;
      const previous = history.slice(0, -1); // posisi terakhir dipakai ikon kereta, bukan dot
      for (const p of previous) {
        if (trailDots.has(p.waktu)) continue;
        L.circleMarker([p.lat, p.lon], {
          radius: 4,
          color: '#00539C',
          weight: 1,
          fillColor: '#00539C',
          fillOpacity: 0.55,
        }).addTo(map);
        trailDots.add(p.waktu);
      }
    } catch (e) {
      console.error(e);
    }
  }

  function damagePopupHtml(d) {
    return `
      <div class="damage-popup">
        <img src="/uploads/${d.image}" alt="Foto kerusakan">
        <div class="keterangan">${d.keterangan || 'Tidak ada keterangan'}</div>
        <div class="waktu"><i class="fa-regular fa-clock"></i>${formatWaktu(d.waktu)}</div>
      </div>
    `;
  }

  function renderDamageList(damages) {
    const list = document.getElementById('damage-list');
    document.getElementById('stat-total').textContent = damages.length;
    document.getElementById('list-count').textContent = damages.length;

    if (damages.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <i class="fa-solid fa-camera-retro"></i>
          Belum ada kerusakan yang tercatat.
        </div>`;
      return;
    }

    const sorted = [...damages].sort((a, b) => new Date(b.waktu) - new Date(a.waktu));
    list.innerHTML = sorted.map(d => `
      <div class="damage-item" data-id="${d.id}">
        <img src="/uploads/${d.image}" alt="Foto kerusakan" loading="lazy">
        <div class="info">
          <div class="keterangan">${d.keterangan || 'Tidak ada keterangan'}</div>
          <div class="waktu"><i class="fa-regular fa-clock"></i>${formatWaktu(d.waktu)}</div>
        </div>
      </div>
    `).join('');

    list.querySelectorAll('.damage-item').forEach(el => {
      el.addEventListener('click', () => {
        const marker = damageMarkers[el.dataset.id];
        if (marker) {
          map.setView(marker.getLatLng(), 17);
          marker.openPopup();
          sidebar.classList.remove('open');
          scrim.classList.remove('open');
        }
      });
    });
  }

  async function updateDamages() {
    try {
      const damages = await fetchJSON('/api/damages');
      for (const d of damages) {
        if (damageMarkers[d.id]) continue;
        const marker = L.marker([d.lat, d.lon], { icon: damageIcon })
          .addTo(map)
          .bindPopup(damagePopupHtml(d));
        damageMarkers[d.id] = marker;
      }
      renderDamageList(damages);

      if (!hasFitBounds && damages.length > 0) {
        const bounds = L.latLngBounds(damages.map(d => [d.lat, d.lon]));
        if (loriMarker) bounds.extend(loriMarker.getLatLng());
        map.fitBounds(bounds, { padding: [40, 40], maxZoom: 16 });
        hasFitBounds = true;
      }
    } catch (e) {
      console.error(e);
    }
  }

  function setStatus(online) {
    const el = document.getElementById('status');
    el.querySelector('.label').textContent = online ? 'Terhubung' : 'Terputus';
    el.className = online ? 'online' : 'offline';
  }

  // ---------- Log Perjalanan (Trip) ----------

  const tripModalScrim = document.getElementById('trip-modal-scrim');
  const tripList = document.getElementById('trip-list');
  const historyBanner = document.getElementById('history-banner');
  const historyBannerText = document.getElementById('history-banner-text');

  function openTripModal() {
    tripModalScrim.classList.add('open');
    loadTripList();
  }
  function closeTripModal() {
    tripModalScrim.classList.remove('open');
  }
  document.getElementById('trip-log-btn').addEventListener('click', openTripModal);
  document.getElementById('trip-modal-close').addEventListener('click', closeTripModal);
  tripModalScrim.addEventListener('click', (e) => {
    if (e.target === tripModalScrim) closeTripModal();
  });

  async function loadTripList() {
    tripList.innerHTML = '<div class="empty-state"><i class="fa-solid fa-route"></i>Memuat riwayat perjalanan...</div>';
    try {
      const trips = await fetchJSON('/api/trips');
      renderTripList(trips);
    } catch (e) {
      tripList.innerHTML = '<div class="empty-state"><i class="fa-solid fa-triangle-exclamation"></i>Gagal memuat riwayat perjalanan.</div>';
      console.error(e);
    }
  }

  function renderTripList(trips) {
    if (!trips || trips.length === 0) {
      tripList.innerHTML = '<div class="empty-state"><i class="fa-solid fa-route"></i>Belum ada perjalanan tercatat.</div>';
      return;
    }
    const sorted = [...trips].sort((a, b) => new Date(b.waktu_mulai) - new Date(a.waktu_mulai));
    tripList.innerHTML = sorted.map(t => `
      <div class="trip-row" data-id="${t.id}">
        <div class="trip-row-top">
          <span class="trip-row-time"><i class="fa-regular fa-clock"></i>${formatWaktu(t.waktu_mulai)}</span>
          <span class="trip-badge ${t.status}">${t.status}</span>
        </div>
        <div class="trip-row-stats">
          <span><i class="fa-solid fa-route"></i>${t.jumlah_titik_gps} titik jalur</span>
          <span><i class="fa-solid fa-triangle-exclamation"></i>${t.jumlah_kerusakan} kerusakan</span>
        </div>
        <button class="trip-view-btn" data-id="${t.id}"><i class="fa-solid fa-map-location-dot"></i> Lihat Jalur di Peta</button>
      </div>
    `).join('');

    tripList.querySelectorAll('.trip-view-btn').forEach(btn => {
      btn.addEventListener('click', () => viewTripPath(btn.dataset.id, sorted.find(t => t.id === btn.dataset.id)));
    });
  }

  async function viewTripPath(tripId, tripSummary) {
    try {
      const detail = await fetchJSON(`/api/trip/${tripId}`);
      clearHistoryView();

      if (detail.jalur && detail.jalur.length > 0) {
        const latlngs = detail.jalur.map(p => [p.lat, p.lon]);
        historyPolyline = L.polyline(latlngs, { color: '#F26522', weight: 3, dashArray: '6,8' }).addTo(map);
        map.fitBounds(historyPolyline.getBounds(), { padding: [40, 40], maxZoom: 16 });
      }

      historyBannerText.textContent = `Jalur ${formatWaktu(detail.waktu_mulai)} — ${detail.jumlah_kerusakan} kerusakan`;
      historyBanner.classList.add('open');
      closeTripModal();
      sidebar.classList.remove('open');
      scrim.classList.remove('open');
    } catch (e) {
      console.error(e);
    }
  }

  function clearHistoryView() {
    if (historyPolyline) {
      map.removeLayer(historyPolyline);
      historyPolyline = null;
    }
    historyBanner.classList.remove('open');
  }
  document.getElementById('history-banner-close').addEventListener('click', clearHistoryView);

  document.getElementById('reset-trip-btn').addEventListener('click', async () => {
    const yakin = confirm('Reset perjalanan? Trip yang sedang berjalan akan ditutup dan siklus baru dimulai dari awal.');
    if (!yakin) return;
    const btn = document.getElementById('reset-trip-btn');
    btn.disabled = true;
    try {
      await postJSON('/api/trip/reset');
      await loadTripList();
    } catch (e) {
      alert('Gagal reset perjalanan. Coba lagi.');
      console.error(e);
    } finally {
      btn.disabled = false;
    }
  });

  async function poll() {
    await Promise.all([updateLoriPosition(), updateLoriTrail(), updateDamages()]);
  }

  poll();
  setInterval(poll, 5000);
</script>
</body>
</html>
