<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RailInspector Dashboard</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap');

  :root {
    --bg: #0b0d12;
    --panel: #12151d;
    --panel-2: #171b25;
    --border: #232733;
    --text: #e8e9ed;
    --text-dim: #8b90a0;
    --accent: #3b82f6;
    --accent-dim: #1d3a6b;
    --danger: #f87171;
    --success: #4ade80;
    --radius: 10px;
  }

  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    font-family: 'Montserrat', sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------- Header ---------- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 12px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    z-index: 20;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }
  .brand-icon {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), #6366f1);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 16px;
  }
  .brand-text h1 {
    font-size: 15px;
    font-weight: 700;
    margin: 0;
    letter-spacing: 0.2px;
  }
  .brand-text .subtitle {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .header-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  #status {
    font-size: 11px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 20px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  #status .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--text-dim);
  }
  #status.online { color: var(--success); }
  #status.online .dot { background: var(--success); box-shadow: 0 0 6px var(--success); }
  #status.offline { color: var(--danger); }
  #status.offline .dot { background: var(--danger); }

  .icon-btn {
    display: none;
    width: 34px;
    height: 34px;
    align-items: center;
    justify-content: center;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    cursor: pointer;
    font-size: 16px;
  }

  /* ---------- Layout ---------- */
  .layout {
    flex: 1;
    display: flex;
    min-height: 0;
  }
  #map {
    flex: 1;
    height: 100%;
  }

  aside {
    width: 320px;
    flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .stats-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 14px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .stat-card {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px;
  }
  .stat-card .value {
    font-size: 20px;
    font-weight: 700;
    line-height: 1.2;
  }
  .stat-card .label {
    font-size: 10.5px;
    color: var(--text-dim);
    margin-top: 2px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }

  .panel-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px 8px;
    flex-shrink: 0;
  }
  .panel-heading h2 {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-dim);
    margin: 0;
  }
  .panel-heading .count-badge {
    font-size: 11px;
    background: var(--accent-dim);
    color: #93c5fd;
    padding: 2px 8px;
    border-radius: 20px;
    font-weight: 600;
  }

  #damage-list {
    flex: 1;
    overflow-y: auto;
    padding: 0 10px 10px;
  }
  #damage-list::-webkit-scrollbar { width: 6px; }
  #damage-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .damage-item {
    display: flex;
    gap: 10px;
    padding: 8px;
    border-radius: var(--radius);
    cursor: pointer;
    border: 1px solid transparent;
    margin-bottom: 6px;
    transition: background 0.12s ease, border-color 0.12s ease;
  }
  .damage-item:hover {
    background: var(--panel-2);
    border-color: var(--border);
  }
  .damage-item img {
    width: 52px;
    height: 52px;
    object-fit: cover;
    border-radius: 6px;
    flex-shrink: 0;
    background: var(--panel-2);
  }
  .damage-item .info {
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .damage-item .keterangan {
    font-size: 12.5px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .damage-item .waktu {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  .empty-state {
    text-align: center;
    padding: 32px 16px;
    color: var(--text-dim);
    font-size: 12.5px;
  }
  .empty-state .emoji {
    font-size: 26px;
    display: block;
    margin-bottom: 8px;
  }

  /* ---------- Leaflet popup theming ---------- */
  .leaflet-popup-content-wrapper {
    background: var(--panel-2);
    color: var(--text);
    border-radius: var(--radius);
  }
  .leaflet-popup-tip { background: var(--panel-2); }
  .leaflet-popup-content { margin: 10px; }
  .damage-popup img {
    width: 220px;
    max-width: 100%;
    border-radius: 6px;
    display: block;
    margin-bottom: 6px;
  }
  .damage-popup .keterangan {
    font-size: 13px;
    font-weight: 600;
    margin: 4px 0 2px;
  }
  .damage-popup .waktu {
    font-size: 11px;
    color: var(--text-dim);
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 820px) {
    .brand-text .subtitle { display: none; }
    .icon-btn { display: flex; }
    aside {
      position: fixed;
      top: 59px;
      bottom: 0;
      left: 0;
      width: 85vw;
      max-width: 340px;
      transform: translateX(-100%);
      transition: transform 0.2s ease;
      z-index: 15;
      box-shadow: 4px 0 24px rgba(0,0,0,0.4);
    }
    aside.open { transform: translateX(0); }
    .scrim {
      display: none;
      position: fixed;
      inset: 59px 0 0 0;
      background: rgba(0,0,0,0.45);
      z-index: 14;
    }
    .scrim.open { display: block; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <button class="icon-btn" id="menu-toggle" aria-label="Buka daftar kerusakan">&#9776;</button>
    <div class="brand-icon">&#128666;</div>
    <div class="brand-text">
      <h1>RailInspector</h1>
      <div class="subtitle">Monitoring Kerusakan Rel Kereta Api &mdash; Politeknik Negeri Malang</div>
    </div>
  </div>
  <div class="header-actions">
    <div id="status" class="offline"><span class="dot"></span><span class="label">Menghubungkan...</span></div>
  </div>
</header>

<div class="layout">
  <aside id="sidebar">
    <div class="stats-row">
      <div class="stat-card">
        <div class="value" id="stat-total">0</div>
        <div class="label">Total Kerusakan</div>
      </div>
      <div class="stat-card">
        <div class="value" id="stat-lori">&mdash;</div>
        <div class="label">Status Lori</div>
      </div>
    </div>
    <div class="panel-heading">
      <h2>Daftar Kerusakan</h2>
      <span class="count-badge" id="list-count">0</span>
    </div>
    <div id="damage-list">
      <div class="empty-state">
        <span class="emoji">&#128247;</span>
        Belum ada kerusakan yang tercatat.
      </div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const map = L.map('map', { zoomControl: false }).setView([-7.9553, 112.6146], 15); // default: Malang
  L.control.zoom({ position: 'bottomright' }).addTo(map);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  const loriIcon = L.divIcon({
    className: 'lori-icon',
    html: '<div style="background:#3b82f6;width:16px;height:16px;border-radius:50%;border:3px solid white;box-shadow:0 0 8px rgba(59,130,246,0.8);"></div>',
    iconSize: [22, 22],
    iconAnchor: [11, 11],
  });

  const damageIcon = L.divIcon({
    className: 'damage-icon',
    html: '<div style="background:#f87171;width:14px;height:14px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid white;"></div>',
    iconSize: [18, 18],
    iconAnchor: [9, 18],
  });

  let loriMarker = null;
  const damageMarkers = {};
  let hasFitBounds = false;

  const sidebar = document.getElementById('sidebar');
  const scrim = document.getElementById('scrim');
  document.getElementById('menu-toggle').addEventListener('click', () => {
    sidebar.classList.toggle('open');
    scrim.classList.toggle('open');
  });
  scrim.addEventListener('click', () => {
    sidebar.classList.remove('open');
    scrim.classList.remove('open');
  });

  async function fetchJSON(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error('Gagal mengambil data: ' + url);
    return res.json();
  }

  function formatWaktu(iso) {
    return new Date(iso).toLocaleString('id-ID', {
      day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit'
    });
  }

  async function updateLoriPosition() {
    try {
      const current = await fetchJSON('/api/gps/current');
      setStatus(true);
      const statLori = document.getElementById('stat-lori');
      if (!current) {
        statLori.textContent = 'Belum ada sinyal';
        return;
      }
      statLori.textContent = 'Aktif';
      const latlng = [current.lat, current.lon];
      if (!loriMarker) {
        loriMarker = L.marker(latlng, { icon: loriIcon }).addTo(map)
          .bindPopup('Posisi Lori Saat Ini');
        if (!hasFitBounds) map.setView(latlng, 16);
      } else {
        loriMarker.setLatLng(latlng);
      }
    } catch (e) {
      setStatus(false);
      console.error(e);
    }
  }

  function damagePopupHtml(d) {
    return `
      <div class="damage-popup">
        <img src="/uploads/${d.image}" alt="Foto kerusakan">
        <div class="keterangan">${d.keterangan || 'Tidak ada keterangan'}</div>
        <div class="waktu">${formatWaktu(d.waktu)}</div>
      </div>
    `;
  }

  function renderDamageList(damages) {
    const list = document.getElementById('damage-list');
    document.getElementById('stat-total').textContent = damages.length;
    document.getElementById('list-count').textContent = damages.length;

    if (damages.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <span class="emoji">&#128247;</span>
          Belum ada kerusakan yang tercatat.
        </div>`;
      return;
    }

    const sorted = [...damages].sort((a, b) => new Date(b.waktu) - new Date(a.waktu));
    list.innerHTML = sorted.map(d => `
      <div class="damage-item" data-id="${d.id}">
        <img src="/uploads/${d.image}" alt="Foto kerusakan" loading="lazy">
        <div class="info">
          <div class="keterangan">${d.keterangan || 'Tidak ada keterangan'}</div>
          <div class="waktu">${formatWaktu(d.waktu)}</div>
        </div>
      </div>
    `).join('');

    list.querySelectorAll('.damage-item').forEach(el => {
      el.addEventListener('click', () => {
        const marker = damageMarkers[el.dataset.id];
        if (marker) {
          map.setView(marker.getLatLng(), 17);
          marker.openPopup();
          sidebar.classList.remove('open');
          scrim.classList.remove('open');
        }
      });
    });
  }

  async function updateDamages() {
    try {
      const damages = await fetchJSON('/api/damages');
      for (const d of damages) {
        if (damageMarkers[d.id]) continue;
        const marker = L.marker([d.lat, d.lon], { icon: damageIcon })
          .addTo(map)
          .bindPopup(damagePopupHtml(d));
        damageMarkers[d.id] = marker;
      }
      renderDamageList(damages);

      if (!hasFitBounds && damages.length > 0) {
        const bounds = L.latLngBounds(damages.map(d => [d.lat, d.lon]));
        if (loriMarker) bounds.extend(loriMarker.getLatLng());
        map.fitBounds(bounds, { padding: [40, 40], maxZoom: 16 });
        hasFitBounds = true;
      }
    } catch (e) {
      console.error(e);
    }
  }

  function setStatus(online) {
    const el = document.getElementById('status');
    el.querySelector('.label').textContent = online ? 'Terhubung' : 'Terputus';
    el.className = online ? 'online' : 'offline';
  }

  async function poll() {
    await Promise.all([updateLoriPosition(), updateDamages()]);
  }

  poll();
  setInterval(poll, 5000);
</script>
</body>
</html>
