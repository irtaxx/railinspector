# Reverse proxy untuk RailInspector API.
# Copy ke /etc/nginx/sites-available/railinspector di VPS,
# lalu symlink ke sites-enabled.
#
# Ganti "IP_VPS_KAMU" dengan IP publik VPS (atau domain kalau sudah punya).

server {
    listen 80;
    server_name IP_VPS_KAMU;

    client_max_body_size 20M;  # foto kerusakan dari kamera bisa cukup besar

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
